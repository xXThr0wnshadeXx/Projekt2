name: Commit hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  no-tool-attribution:
    name: No tool attribution in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          if [ -n "${BASE:-}" ] && [ -n "${HEAD:-}" ]; then
            RANGE="$BASE..$HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Scanning $RANGE"
          PATTERN='claude|anthropic|\bcodex\b|copilot|\bcursor\b|chatgpt|co-authored-by:.*(bot|noreply@(anthropic|openai)\.com)|generated with|assisted-by:|ai-(generated|assisted)'
          FOUND=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            HIT="$(git log -1 --format='%B%n%an <%ae>%n%cn <%ce>' "$sha" | grep -inE "$PATTERN" || true)"
            if [ -n "$HIT" ]; then
              echo "::error::$sha contains tool attribution:"
              echo "$HIT"
              FOUND=1
            fi
          done < <(git rev-list "$RANGE" 2>/dev/null || git rev-list -1 HEAD)
          if [ "$FOUND" -eq 1 ]; then
            echo
            echo "Reword the commits (git rebase -i, or git commit --amend for the last one)."
            exit 1
          fi
          echo "Commit messages clean."

      - name: Scan pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -u
          PATTERN='claude|anthropic|\bcodex\b|copilot|\bcursor\b|chatgpt|generated with|ai-(generated|assisted)'
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -inE "$PATTERN"; then
            echo "::error::The pull request title or body names a tool. Please edit it."
            exit 1
          fi
          echo "Pull request text clean."
