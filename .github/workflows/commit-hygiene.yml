name: Commit hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  messages:
    name: Commit messages describe the change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          TEAM='sshreev2703@gmail\.com|users\.noreply\.github\.com'
          FOOTER='^[[:space:]]*((generated|written|authored|created|produced|assisted)[[:space:]]+(with|by|using)[[:space:]]|(assisted|generated)-by:|(tool|agent|model|assistant):[[:space:]])'

          if [ -n "${BASE:-}" ] && [ -n "${HEAD:-}" ]; then RANGE="$BASE..$HEAD"; else RANGE="HEAD~1..HEAD"; fi
          echo "Scanning $RANGE"

          FOUND=0
          for sha in $(git rev-list "$RANGE" 2>/dev/null || git rev-list -1 HEAD); do
            BODY="$(git log -1 --format='%B' "$sha")"

            if printf '%s\n' "$BODY" | grep -qiE "$FOOTER"; then
              echo "::error::$sha has a machine-generated footer"
              printf '%s\n' "$BODY" | grep -inE "$FOOTER"
              FOUND=1
            fi

            CO="$(printf '%s\n' "$BODY" | grep -iE '^[[:space:]]*co-authored-by:' | grep -ivE "$TEAM" || true)"
            if [ -n "$CO" ]; then
              echo "::error::$sha has a co-author who is not on the team"
              echo "$CO"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo
            echo "Reword with 'git commit --amend' (last commit) or 'git rebase -i' (earlier)."
            exit 1
          fi
          echo "Commit messages clean."

      - name: Scan pull request text
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -u
          # Anchored like the commit scan: a real footer starts its own line,
          # optionally behind a bullet or an emoji. Unanchored, this matched
          # ordinary prose such as "written by default" or "authored by <name>".
          LEAD='^[^[:alnum:]]*'
          FOOTER="${LEAD}((generated|written|authored|created|produced|assisted)[[:space:]]+(with|by|using)[[:space:]]|(assisted|generated|co-authored)-by:)"
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -inE "$FOOTER"; then
            echo "::error::The pull request text carries an attribution footer. Please edit it."
            exit 1
          fi
          echo "Pull request text clean."
