name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r backend/requirements.txt

      - name: pytest
        # No real keys in CI: route tests mock the model client.
        env:
          OPENAI_API_KEY: ""
        run: |
          set +e
          python -m pytest tests -q
          code=$?
          # 5 = no tests collected yet; anything else non-zero fails the PR.
          if [ "$code" -eq 5 ]; then echo "No back-end tests collected yet."; exit 0; fi
          exit "$code"

  frontend:
    name: Front-end smoke (Playwright)
    # Pinned: Playwright 1.49 installs WebKit's system libraries by their
    # Ubuntu 24.04 names, which ubuntu-latest (26.04) no longer has.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run front-end unit tests
        working-directory: frontend
        run: npm test

      - name: Make front-end packages resolvable from the root Playwright config
        run: ln -sfn frontend/node_modules node_modules

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}

      # Chromium for desktop, WebKit for iPhone Safari (Flow B). Safari's
      # keyboard behaviour differs (Tab skips buttons by default), and a bug
      # that only showed there was what added it.
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Start dev server
        working-directory: frontend
        run: |
          nohup npx vite --port 5173 --strictPort > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173 > /dev/null && exit 0
            sleep 1
          done
          echo "Dev server did not start:"; cat /tmp/vite.log; exit 1

      - name: Playwright smoke (@smoke)
        env:
          CI: "true"
          BASE_URL: http://localhost:5173
        run: npx playwright test --grep @smoke --project=chromium --project=mobile-safari --pass-with-no-tests --reporter=line

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
