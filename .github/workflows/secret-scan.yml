name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  credentials:
    name: No credentials in the diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          if [ -n "${BASE:-}" ] && [ -n "${HEAD:-}" ]; then
            FILES="$(git diff --name-only --diff-filter=ACM "$BASE" "$HEAD")"
          else
            FILES="$(git diff --name-only --diff-filter=ACM HEAD~1 HEAD 2>/dev/null || git ls-files)"
          fi
          [ -z "$FILES" ] && { echo "No files to scan."; exit 0; }

          FAIL=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            case "$f" in
              *.lock|*.min.js|*.map) continue ;;
              .githooks/*|.github/workflows/*) continue ;;
            esac

            case "$(basename "$f")" in
              .env|.env.*)
                if [ "$(basename "$f")" != ".env.example" ]; then
                  echo "::error file=$f::env file committed"
                  FAIL=1
                fi
                ;;
            esac

            for p in \
              'sk-[A-Za-z0-9_-]{20,}' \
              'AKIA[0-9A-Z]{16}' \
              'ghp_[A-Za-z0-9]{36}' \
              'gho_[A-Za-z0-9]{36}' \
              'github_pat_[A-Za-z0-9_]{50,}' \
              'BEGIN[A-Z ]*PRIVATE KEY' \
              '(api[_-]?key|secret|token|password)[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9_-]{16,}["'"'"']'
            do
              if grep -nEo -e "$p" "$f" | head -3 | grep -q .; then
                echo "::error file=$f::possible credential"
                grep -nEo -e "$p" "$f" | head -3 | sed 's/^/    /'
                FAIL=1
              fi
            done
          done <<< "$FILES"

          if [ "$FAIL" -eq 1 ]; then
            echo
            echo "Move the value into backend/.env and reference it through config,"
            echo "or add a placeholder to backend/.env.example. Then rotate the key."
            exit 1
          fi
          echo "No credentials found."
