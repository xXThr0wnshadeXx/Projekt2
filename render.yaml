# Render Blueprint for the back end. New > Blueprint > pick this repo.
# Secrets are entered in the Render dashboard, never here.
services:
  - type: web
    name: glance-api
    runtime: python
    rootDir: backend
    # Free, so the project costs nothing to run. A free service sleeps after
    # fifteen minutes without a request and takes about a minute to wake, so
    # open /api/health a few minutes before a demo. `starter` never sleeps.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL_VISION
        sync: false
      - key: MODEL_TEXT
        sync: false
      - key: MODEL_STT
        sync: false
      # Not a secret: the address of the front end, which must match exactly.
      - key: ALLOWED_ORIGIN
        value: https://glance-shreev2703.vercel.app
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: ENVIRONMENT
        value: production
      # Shared daily ceiling for routes that call a model. Adjust for the demo.
      - key: MODEL_CALL_LIMIT
        value: "1500"
      - key: MODEL_CALL_WINDOW_SECONDS
        value: "86400"
